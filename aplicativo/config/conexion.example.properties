# Configuración de la conexión del aplicativo a PostgreSQL.
# Copiar este archivo como conexion.properties (en esta misma carpeta).
# conexion.properties no se versiona. Si db.clave queda vacío, o si el
# archivo no existe, el aplicativo pide los datos al iniciar.

# Servidor y base de datos creada por scripts/registro_comprobantes_completo.sql
db.host=localhost
db.puerto=5432
db.base=registro_comprobantes

# Rol del aplicativo, creado por scripts/08_permisos.sql (no usar postgres).
# La contraseña puede escribirse aquí o ingresarse en pantalla al iniciar.
db.usuario=gdi_app
db.clave=

# Segundos de espera para conectar antes de informar un error
db.tiempoEspera=5
