name: Publicar instaladores

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/releases.yml'
      - 'distribucion/nativa/**'
      - 'aplicativo/src/**'
      - 'herramientas/compilar.*'
      - 'scripts/registro_comprobantes_completo.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Construir y probar los instaladores Linux
        run: |
          set -euo pipefail
          version="1.1.$GITHUB_RUN_NUMBER"
          bash herramientas/compilar.sh
          bash distribucion/nativa/preparar.sh linux paquete
          mkdir salida
          for modo in headless embebido; do
            archivo="salida/AppGDI-Dinosaurios-${modo^}-Linux-x64.run"
            bash distribucion/nativa/empaquetar-linux.sh paquete "$version" "$modo" "$archivo"
            XDG_DATA_HOME="$RUNNER_TEMP/datos-$modo" bash "$archivo" --verificar "$RUNNER_TEMP"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: salida/*.run
          if-no-files-found: error
          compression-level: 0

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar la aplicación
        shell: pwsh
        run: .\herramientas\compilar.ps1
      - name: Preparar PostgreSQL y Java para Windows
        shell: bash
        run: bash distribucion/nativa/preparar.sh windows distribucion/nativa/paquete
      - name: Construir y probar los instaladores Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "1.1.$env:GITHUB_RUN_NUMBER"
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
              choco install innosetup -y --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($variant in 'Headless', 'Embebido') {
              Set-Content -Encoding ascii distribucion/nativa/paquete/modo.txt $variant.ToLowerInvariant()
              & $compiler "/DVersion=$version" "/DVariante=$variant" distribucion/nativa/instalador.iss
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $installer = Resolve-Path "distribucion/nativa/salida/AppGDI-Dinosaurios-$variant-Windows-x64.exe"
              $installed = Join-Path $env:RUNNER_TEMP "AppGDI $variant"
              $result = Start-Process -FilePath $installer.Path -Wait -PassThru -ArgumentList @(
                  '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="{0}"' -f $installed))
              if ($result.ExitCode -ne 0) { throw "El instalador devolvió $($result.ExitCode)." }
              & "$installed\java\bin\java.exe" '-Djava.awt.headless=true' -cp "$installed\inicio.jar;$installed\app.jar" sermed.comprobantes.distribucion.InicioNativo $installed --verificar $env:RUNNER_TEMP
              if ($LASTEXITCODE -ne 0) {
                  $code = $LASTEXITCODE
                  Get-ChildItem "$env:RUNNER_TEMP\appgdi-prueba-*\*.log" | Get-Content -Tail 20
                  exit $code
              }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: distribucion/nativa/salida/*.exe
          if-no-files-found: error
          compression-level: 0

  publicar:
    if: github.ref == 'refs/heads/main'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: salida
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: salida
      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="1.1.$GITHUB_RUN_NUMBER"
          cd salida
          sha256sum AppGDI-Dinosaurios-* > SHA256SUMS.txt
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AppGDI Dinosaurios $version · PostgreSQL nativo" \
            --notes "Cuatro instaladores x64 para Linux y Windows. Headless mantiene PostgreSQL en segundo plano. Embebido inicia y detiene la instancia con AppGDI. Ambos incluyen Java y PostgreSQL 17, usan datos separados y no requieren Docker." \
            AppGDI-Dinosaurios-* SHA256SUMS.txt
