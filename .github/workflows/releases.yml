name: Publicar instaladores

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/releases.yml'
      - 'distribucion/nativa/**'
      - 'aplicativo/src/**'
      - 'herramientas/compilar.*'
      - 'scripts/registro_comprobantes_completo.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Construir y probar los instaladores Linux
        run: |
          set -euo pipefail
          version="1.1.$GITHUB_RUN_NUMBER"
          bash herramientas/compilar.sh
          bash distribucion/nativa/preparar.sh linux paquete
          mkdir salida
          for modo in headless embebido; do
            archivo="salida/AppGDI-Dinosaurios-${modo^}-Linux-x64.run"
            bash distribucion/nativa/empaquetar-linux.sh paquete "$version" "$modo" "$archivo"
            # Rutas con espacios y tildes, como /home/José o C:\Users\José.
            pruebas="$RUNNER_TEMP/Prueba José $modo"
            mkdir -p "$pruebas"
            XDG_DATA_HOME="$RUNNER_TEMP/Datos José $modo" bash "$archivo" --verificar "$pruebas"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: salida/*.run
          if-no-files-found: error
          compression-level: 0

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar la aplicación
        shell: pwsh
        run: .\herramientas\compilar.ps1
      - name: Preparar PostgreSQL y Java para Windows
        shell: bash
        run: bash distribucion/nativa/preparar.sh windows distribucion/nativa/paquete
      - name: Construir y probar los instaladores Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "1.1.$env:GITHUB_RUN_NUMBER"
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
              choco install innosetup -y --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($variant in 'Headless', 'Embebido') {
              Set-Content -Encoding ascii distribucion/nativa/paquete/modo.txt $variant.ToLowerInvariant()
              & $compiler "/DVersion=$version" "/DVariante=$variant" distribucion/nativa/instalador.iss
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $installer = Resolve-Path "distribucion/nativa/salida/AppGDI-Dinosaurios-$variant-Windows-x64.exe"
              # Carpeta con espacios y tildes: el instalador por defecto usa
              # %LOCALAPPDATA%\Programs, que incluye el nombre del usuario (C:\Users\José).
              $installed = Join-Path $env:RUNNER_TEMP "AppGDI José $variant"
              $pruebas = Join-Path $env:RUNNER_TEMP "Prueba Ñandú $variant"
              New-Item -ItemType Directory -Force $pruebas | Out-Null
              $result = Start-Process -FilePath $installer.Path -Wait -PassThru -ArgumentList @(
                  '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="{0}"' -f $installed))
              if ($result.ExitCode -ne 0) { throw "El instalador devolvió $($result.ExitCode)." }
              & "$installed\java\bin\java.exe" '-Djava.awt.headless=true' -cp "$installed\inicio.jar;$installed\app.jar" sermed.comprobantes.distribucion.InicioNativo $installed --verificar $pruebas
              if ($LASTEXITCODE -ne 0) {
                  $code = $LASTEXITCODE
                  Get-ChildItem "$pruebas\appgdi-prueba-*\*.log" | Get-Content -Tail 20
                  exit $code
              }
          }
      - name: Empaquetar la carpeta portátil de Windows (variante Embebido)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Content -Encoding ascii distribucion/nativa/paquete/modo.txt embebido
          $destino = 'distribucion/nativa/salida/AppGDI-Dinosaurios-Embebido-Windows-x64-portable.zip'
          Compress-Archive -Path distribucion/nativa/paquete/* -DestinationPath $destino -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            distribucion/nativa/salida/*.exe
            distribucion/nativa/salida/*.zip
          if-no-files-found: error
          compression-level: 0

  publicar:
    if: github.ref == 'refs/heads/main'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: salida
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: salida
      - uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: distribucion/nativa/firmar.sh
          sparse-checkout-cone-mode: false
      - name: Firmar los instaladores de Windows (solo si hay certificado)
        env:
          # Certificado .p12/.pfx en base64, o un servicio en la nube (FIRMA_TIPO y
          # FIRMA_ALMACEN como variables del repositorio). Sin ellos se publica sin firmar.
          FIRMA_PFX_BASE64: ${{ secrets.FIRMA_PFX_BASE64 }}
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
          FIRMA_TIPO: ${{ vars.FIRMA_TIPO }}
          FIRMA_ALMACEN: ${{ vars.FIRMA_ALMACEN }}
          FIRMA_ALIAS: ${{ vars.FIRMA_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${FIRMA_PFX_BASE64}${FIRMA_ALMACEN}" ]]; then
            echo "::notice::Sin certificado configurado: los instaladores se publican sin firmar."
            exit 0
          fi
          if [[ -n "$FIRMA_PFX_BASE64" ]]; then
            umask 077
            printf '%s' "$FIRMA_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/firma.p12"
            export FIRMA_ALMACEN="$RUNNER_TEMP/firma.p12"
          fi
          [[ -n "$FIRMA_TIPO" ]] || unset FIRMA_TIPO
          [[ -n "$FIRMA_ALIAS" ]] || unset FIRMA_ALIAS
          bash repo/distribucion/nativa/firmar.sh salida/*.exe
          rm -f "$RUNNER_TEMP/firma.p12"
      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="1.1.$GITHUB_RUN_NUMBER"
          cd salida
          sha256sum AppGDI-Dinosaurios-* > SHA256SUMS.txt
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AppGDI Dinosaurios $version · PostgreSQL nativo" \
            --notes "Cuatro instaladores x64 para Linux y Windows y una carpeta portátil para Windows. Headless mantiene PostgreSQL en segundo plano. Embebido inicia y detiene la instancia con AppGDI. Ambos incluyen Java y PostgreSQL 17, usan datos separados y no requieren Docker." \
            AppGDI-Dinosaurios-* SHA256SUMS.txt
